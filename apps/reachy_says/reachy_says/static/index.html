<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Reachy Says</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <h1>Reachy Says</h1>

    <div id="settings">
        <label for="connection-select">Connection</label>
        <select id="connection-select">
            <option value="physical">Physical robot</option>
            <option value="sim">Simulator</option>
        </select>

        <label for="voice-select">Voice</label>
        <select id="voice-select"></select>

        <label for="volume-slider">Volume</label>
        <div style="display:flex; align-items:center; gap:8px;">
            <input type="range" id="volume-slider" min="0" max="100" value="50">
            <span id="volume-value">50</span>
        </div>
    </div>

    <div id="idle-panel">
        <label for="timer-input">Round timer (seconds)</label>
        <input type="number" id="timer-input" min="2" max="15" step="0.5" value="2">

        <label for="rounds-input">Number of rounds</label>
        <input type="number" id="rounds-input" min="1" max="20" step="1" value="5">

        <button id="start-btn">Start Game</button>
    </div>

    <div id="game-panel" hidden>
        <div id="round-info">
            Round <span id="round-number">0</span> / <span id="max-rounds">10</span>
            &middot; Score: <span id="score">0</span>
        </div>
        <div id="countdown">--</div>
        <button id="confirm-btn" disabled>I did it!</button>
    </div>

    <div id="result-banner" hidden></div>

    <button id="reset-btn">Reset</button>

    <div id="status">Loading...</div>
    <script src="/static/main.js"></script>
</body>

</html>
