[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"


[project]
name = "reachy_says"
version = "0.1.0"
description = "Simon-Says-style game for Reachy Mini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "reachy-mini",
    "piper-tts",
    "requests",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]  # httpx: needed by FastAPI's TestClient
keywords = ["reachy-mini-app"]

[project.entry-points."reachy_mini_apps"]
reachy_says = "reachy_says.main:ReachySays"

[tool.setuptools]
package-dir = { "" = "." }
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
reachy_says = ["**/*"] # Also include all non-.py files
